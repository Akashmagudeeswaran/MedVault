version: '3.8'

services:
  db:
    image: mysql:8
    container_name: medvault-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: medvault_db
      MYSQL_ROOT_PASSWORD: Devil@312
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically seed schema and data in correct order on first startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      - medvault-network
    restart: always

  backend:
    build: ./backend
    container_name: medvault-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/medvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Devil@312
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - medvault-network
    restart: always

  frontend:
    build: ./frontend
    container_name: medvault-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medvault-network
    restart: always

volumes:
  mysql-data:

networks:
  medvault-network:
    driver: bridge
