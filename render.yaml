services:
  # Combined Monolith Service (Spring Boot serving React Frontend & REST APIs)
  - type: web
    name: medvault-backend
    env: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false # Set manually in Dashboard to external MySQL URL
      - key: DB_USERNAME
        sync: false # Set manually in Dashboard to external MySQL username
      - key: DB_PASSWORD
        sync: false # Set manually in Dashboard to external MySQL password
      - key: JWT_SECRET
        generateValue: true # Autogenerated by Render
      - key: ALLOWED_ORIGINS
        value: "*"

