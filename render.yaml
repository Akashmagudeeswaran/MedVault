services:
  # 1. Backend Service (Spring Boot API)
  - type: web
    name: medvault-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false # Set manually in Dashboard to external MySQL URL (e.g. jdbc:mysql://host:port/dbname?options)
      - key: DB_USERNAME
        sync: false # Set manually in Dashboard to external MySQL username
      - key: DB_PASSWORD
        sync: false # Set manually in Dashboard to external MySQL password
      - key: JWT_SECRET
        generateValue: true # Securely autogenerated by Render for free
      - key: ALLOWED_ORIGINS
        value: "*" # Allow all origins, or replace with your static site domain after deployment

  # 2. Frontend Service (Vite React Client)
  - type: web
    name: medvault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set manually to backend's public URL (e.g., https://medvault-backend.onrender.com) once backend is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
