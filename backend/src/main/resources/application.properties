# Server Port
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
# Change this password to match your local MySQL configuration
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration (Allow up to 20MB files as requested)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# MedVault Application Specific Properties
medvault.upload.dir=./uploads
# JWT Secret Key (256-bit Hex string)
medvault.jwt.secret=${JWT_SECRET}
# JWT Expiration: 24 hours (86,400,000 milliseconds)
medvault.jwt.expiration-ms=86400000

# CORS Allowed Origins
medvault.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Enable Swagger Documentation Paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini AI Integration Configuration
gemini.api.key=${GEMINI_API_KEY:}

